[project]
name = "gta5rp-helper"
version = "0.1.0"
description = "PyQt6 helper application for GTA5RP players"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "pyqt6>=6.7,<7",
    "opencv-python>=4.10,<5",
    "mss>=10,<11",
    "numpy>=1.26,<3",
    "pyautogui>=0.9.54,<1",
    "pillow>=10,<13",
    "keyboard>=0.13.5,<1; sys_platform == 'win32'",
    "pyinstaller>=6.22.3",
]
